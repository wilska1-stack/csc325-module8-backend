name: CSC325 CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Setup - check out code
        uses: actions/checkout@v4

      - name: Setup - install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies - install requirements
        run: python -m pip install -r requirements.txt

      - name: Test - run the full test suite
        run: python manage.py test -v 2

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Render rebuilds and restarts the service when this hook is called.
      # The hook URL is stored as the RENDER_DEPLOY_HOOK_URL repository secret.
      - name: Deploy - trigger Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
