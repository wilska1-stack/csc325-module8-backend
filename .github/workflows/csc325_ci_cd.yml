name: CSC325 CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Setup - check out code
        uses: actions/checkout@v4

      - name: Setup - install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencies - install requirements
        run: python -m pip install -r requirements.txt

      - name: Test - run the full test suite
        run: python manage.py test -v 2

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup - check out code
        uses: actions/checkout@v4

      # Packages the tested app as a deployable bundle. No live host is
      # configured yet; replace this step with the tutorial's deploy command.
      - name: Deploy - package the app
        run: |
          mkdir -p dist
          cp -R api config manage.py requirements.txt dist/
          ls -R dist

      - name: Deploy - upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: csc325-app
          path: dist/
